name: Preparar Android

on:
  push:
    branches:
      - preparar/android

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar estrutura Android oficial
        run: |
          flutter create --platforms=android --project-name soundbox --org com.example --no-pub /tmp/soundbox_android
          cp -a /tmp/soundbox_android/android .
          cp /tmp/soundbox_android/.metadata .
          rm -f android/local.properties
          python3 - <<'PY'
          import pathlib, zipfile, subprocess
          root = pathlib.Path('.')
          files = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          files.discard('.github/workflows/android-preview.yml')
          files.add('.metadata')
          files.update(str(p) for p in pathlib.Path('android').rglob('*') if p.is_file())
          with zipfile.ZipFile('/tmp/SoundBox_Android.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in sorted(files):
                  z.write(name, 'soundbox/' + name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: soundbox-android-projeto
          path: /tmp/SoundBox_Android.zip
          if-no-files-found: error
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: soundbox-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
