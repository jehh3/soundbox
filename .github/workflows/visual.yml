name: Capturar SoundBox

on:
  push:
    branches:
      - preview/soundbox-visual

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens test/visual_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: soundbox-visual
          path: test/screenshots/soundbox.png
          if-no-files-found: error
